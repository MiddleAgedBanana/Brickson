# Fails a pull request when a workflow uses an action that
# .github/workflows/actions.lock does not record, or when a locked commit
# no longer checks out against the tag it was locked from. A run also
# refuses an unrecorded action, but only when that workflow runs: no pull
# request runs pages.yml, and a workflow left out of the lockfile runs on
# plain tags with no complaint. This says so on the pull request
# (docs/DECISIONS.md, "Reviews, updates and GitHub settings",
# *Dependencies*). Free for public repositories, and it runs on Linux, so
# it uses none of the Mac machines the tests need.
#
# Not a check the `main` ruleset requires: the owner decides whether it
# becomes one. It has no path filter so that it can.
#
# GitHub's own sample, from the extension's repository
# (.github/workflows/verify-lockfile.yml), with this repository's names and
# a time limit. The extension is pinned to a release GitHub has made
# immutable. Dependabot cannot update that pin: a thread moves it by hand,
# and a lockfile in a newer format fails here until it does.
name: Verify lockfile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Check the lockfile
        run: gh actions-lock --verify
