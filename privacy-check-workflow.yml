# Builds Brickson and runs its tests on GitHub's Mac machines, for every pull
# request and every change to main. Free for public repositories. The
# privacy check runs first, in a job of its own (below).
#
# Each job that tests runs the same script you run on your Mac
# (scripts/test.sh): unit tests on the newest iPad Pro 13-inch simulator
# the chosen Xcode can run, and UI tests on that iPad and on the newest
# standard iPhone, each family on a machine of its own at the same time.
# "UI tests", the check the `main` ruleset requires, passes only when both
# families' jobs passed.
# Each job keeps its result bundles (build/TestResults: every test,
# screenshots of failures, the screens UI tests capture, and which
# simulator processes used the machine) as a download on the run's page
# for 14 days, whether the tests passed or failed.
#
# Every job that tests builds with Apple's newest released Xcode, never a
# pinned one (docs/DECISIONS.md, "Build with Apple's current Xcode").
# `runs-on` names GitHub's machine image for the current major Xcode
# (xcode-27 holds Xcode 27); scripts/select-xcode.py picks the newest
# release installed on it, and warns on the run when Apple has released a
# newer Xcode than the machine has. When Apple releases the next major
# Xcode and GitHub publishes its image, move both xcode `runs-on` lines to
# it.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, unfinished run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  # Personal details stay out of the repository (docs/DECISIONS.md,
  # "Personal details stay out of the repository"). The private list
  # reaches this job alone, on a machine of its own, and nothing from the
  # pull request runs here: only main's own copy of the check reads the
  # list, with nothing from this run's environment but what it needs. (A
  # value a job is given stays in its machine's memory for the whole job,
  # so no other step may run beside it.) A change to this file is the
  # exception: GitHub runs a branch's own copy of it, with the list, as
  # soon as the branch is pushed, so read every change here before pushing
  # it. The log is public: it shows counts only. "Unit tests" waits for
  # this job and fails unless it passed.
  privacy:
    name: Privacy check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Every commit, so the check reads all that this run brings to
          # main; nothing in this job pushes.
          fetch-depth: 0
          persist-credentials: false
      - name: Check for personal details
        env:
          BRICKSON_PRIVATE_WORDS: ${{ secrets.BRICKSON_PRIVATE_WORDS }}
        # main by its full name: a tag named origin/main would come first.
        run: |
          main=refs/remotes/origin/main
          git rev-parse --verify --quiet "$main^{commit}" >/dev/null || {
            echo "::error::main was not fetched, so the privacy check cannot run."
            exit 1
          }
          if ! git cat-file -e "$main:scripts/privacy-check.py" 2>/dev/null; then
            echo "main has no privacy check yet: Unit tests runs this pull request's own."
            exit 0
          fi
          checker="$RUNNER_TEMP/privacy-check.py"
          git show "$main:scripts/privacy-check.py" > "$checker"
          mkdir -p "$RUNNER_TEMP/privacy-home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/privacy-home" LANG=C.UTF-8 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_ACTOR="$GITHUB_ACTOR" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            BRICKSON_PRIVATE_WORDS="$BRICKSON_PRIVATE_WORDS" \
            /usr/bin/python3 -I -X utf8 "$checker" --ci "$GITHUB_WORKSPACE"

  unit:
    name: Unit tests
    needs: privacy
    # Runs however the privacy check ended (its result is checked last),
    # but not in a run that was cancelled.
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, for the first-run privacy check below.
          fetch-depth: 0
          persist-credentials: false
      # Only for the pull request that adds the privacy check, while main
      # has none: its own copy runs here, without the private list, which
      # never reaches this job.
      - name: Check for personal details (first run)
        run: |
          main=refs/remotes/origin/main
          git rev-parse --verify --quiet "$main^{commit}" >/dev/null || {
            echo "::error::main was not fetched, so the privacy check cannot run."
            exit 1
          }
          if git cat-file -e "$main:scripts/privacy-check.py" 2>/dev/null; then
            exit 0
          fi
          git cat-file -e HEAD:scripts/privacy-check.py 2>/dev/null || {
            echo "::error::Neither main nor this pull request has scripts/privacy-check.py."
            exit 1
          }
          /usr/bin/python3 -I scripts/privacy-check.py --ci --no-list "$GITHUB_WORKSPACE"
      - name: Check the Xcode choice
        run: python3 scripts/test-select-xcode.py
      - name: Use the newest released Xcode
        run: |
          xcode="$(python3 scripts/select-xcode.py choose)"
          sudo xcode-select --switch "$xcode"
      - name: Compare with Apple's newest Xcode release
        run: python3 scripts/select-xcode.py check
      - name: Show the Xcode version and simulators
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes available
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew list --versions xcodegen
      - name: Check website contrast and links
        run: python3 scripts/test-site.py
      - name: Check the test script
        run: python3 scripts/test-runner.py
      - name: Build and run the unit tests
        run: scripts/test.sh unit
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/TestResults
          if-no-files-found: warn
          retention-days: 14
      # "Unit tests" is a check the `main` ruleset requires, so it carries
      # the privacy check's result: a failed, cancelled or skipped privacy
      # check never reads as passed.
      - name: Check that the privacy check passed
        if: ${{ !cancelled() }}
        env:
          PRIVACY: ${{ needs.privacy.result }}
        run: |
          if [ "$PRIVACY" != success ]; then
            echo "::error::The privacy check did not pass ($PRIVACY): see the Privacy check job."
            exit 1
          fi
          echo "The privacy check passed."

  # One job per device family, at the same time, so neither waits for the
  # other and each has its own time limit (docs/DECISIONS.md, "Tests").
  # Two jobs rather than a matrix, so the "UI tests" check below reads each
  # family's own result: a matrix reports one result for all its legs, and
  # that summary has been seen to read as passed when a leg never got a
  # machine. scripts/test-runner.py checks that the two jobs stay the same
  # apart from the family.
  ui-ipad:
    name: UI tests on iPad
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use the newest released Xcode
        run: |
          xcode="$(python3 scripts/select-xcode.py choose)"
          sudo xcode-select --switch "$xcode"
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew list --versions xcodegen
      - name: Build the app and run the UI tests
        env:
          SIMULATOR_FAMILY: ipad
        run: scripts/test.sh ui
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-ipad
          path: build/TestResults
          if-no-files-found: warn
          retention-days: 14

  ui-iphone:
    name: UI tests on iPhone
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use the newest released Xcode
        run: |
          xcode="$(python3 scripts/select-xcode.py choose)"
          sudo xcode-select --switch "$xcode"
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew list --versions xcodegen
      - name: Build the app and run the UI tests
        env:
          SIMULATOR_FAMILY: iphone
        run: scripts/test.sh ui
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-iphone
          path: build/TestResults
          if-no-files-found: warn
          retention-days: 14

  # The check the `main` ruleset requires by name. It runs however the
  # family jobs ended, and fails unless both of them passed: a failed,
  # cancelled or skipped family never reads as passed.
  ui-result:
    name: UI tests
    needs: [ui-ipad, ui-iphone]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the UI tests passed on both families
        env:
          IPAD: ${{ needs.ui-ipad.result }}
          IPHONE: ${{ needs.ui-iphone.result }}
        run: |
          if [ "$IPAD" != success ] || [ "$IPHONE" != success ]; then
            echo "The UI tests did not pass on both families (iPad: $IPAD, iPhone: $IPHONE)."
            exit 1
          fi
          echo "The UI tests passed on the iPad and the iPhone."
