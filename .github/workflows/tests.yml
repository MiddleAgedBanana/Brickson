# Builds Brickson and runs its tests on GitHub's Mac machines, for every pull
# request and every change to main. Free for public repositories.
#
# Each job runs the same script you run on your Mac (scripts/test.sh): unit
# tests on the newest iPad Pro 13-inch simulator the chosen Xcode can run,
# and UI tests on that iPad and on the newest standard iPhone, each family
# on a machine of its own at the same time. "UI tests", the check the
# `main` ruleset requires, passes only when both families' jobs passed.
# Each job keeps its result bundles (build/TestResults: every test,
# screenshots of failures, the screens UI tests capture, and which
# simulator processes used the machine) as a download on the run's page
# for 14 days, whether the tests passed or failed.
#
# Every job that tests builds with Apple's newest released Xcode, never a
# pinned one (docs/DECISIONS.md, "Build with Apple's current Xcode").
# `runs-on` names GitHub's machine image for the current major Xcode
# (xcode-27 holds Xcode 27); scripts/select-xcode.py picks the newest
# release installed on it, and warns on the run when Apple has released a
# newer Xcode than the machine has. When Apple releases the next major
# Xcode and GitHub publishes its image, move both xcode `runs-on` lines to
# it.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, unfinished run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  unit:
    name: Unit tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the Xcode choice
        run: python3 scripts/test-select-xcode.py
      - name: Use the newest released Xcode
        run: |
          xcode="$(python3 scripts/select-xcode.py choose)"
          sudo xcode-select --switch "$xcode"
      - name: Compare with Apple's newest Xcode release
        run: python3 scripts/select-xcode.py check
      - name: Show the Xcode version and simulators
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes available
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew list --versions xcodegen
      - name: Check website contrast and links
        run: python3 scripts/test-site.py
      - name: Check the test script
        run: python3 scripts/test-runner.py
      - name: Build and run the unit tests
        run: scripts/test.sh unit
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-results
          path: build/TestResults
          if-no-files-found: warn
          retention-days: 14

  # One job per device family, at the same time, so neither waits for the
  # other and each has its own time limit (docs/DECISIONS.md, "Tests").
  # Two jobs rather than a matrix, so the "UI tests" check below reads each
  # family's own result: a matrix reports one result for all its legs, and
  # that summary has been seen to read as passed when a leg never got a
  # machine. scripts/test-runner.py checks that the two jobs stay the same
  # apart from the family.
  ui-ipad:
    name: UI tests on iPad
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use the newest released Xcode
        run: |
          xcode="$(python3 scripts/select-xcode.py choose)"
          sudo xcode-select --switch "$xcode"
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew list --versions xcodegen
      - name: Build the app and run the UI tests
        env:
          SIMULATOR_FAMILY: ipad
        run: scripts/test.sh ui
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-test-results-ipad
          path: build/TestResults
          if-no-files-found: warn
          retention-days: 14

  ui-iphone:
    name: UI tests on iPhone
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use the newest released Xcode
        run: |
          xcode="$(python3 scripts/select-xcode.py choose)"
          sudo xcode-select --switch "$xcode"
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew list --versions xcodegen
      - name: Build the app and run the UI tests
        env:
          SIMULATOR_FAMILY: iphone
        run: scripts/test.sh ui
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-test-results-iphone
          path: build/TestResults
          if-no-files-found: warn
          retention-days: 14

  # The check the `main` ruleset requires by name. It runs however the
  # family jobs ended, and fails unless both of them passed: a failed,
  # cancelled or skipped family never reads as passed.
  ui-result:
    name: UI tests
    needs: [ui-ipad, ui-iphone]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the UI tests passed on both families
        env:
          IPAD: ${{ needs.ui-ipad.result }}
          IPHONE: ${{ needs.ui-iphone.result }}
        run: |
          if [ "$IPAD" != success ] || [ "$IPHONE" != success ]; then
            echo "The UI tests did not pass on both families (iPad: $IPAD, iPhone: $IPHONE)."
            exit 1
          fi
          echo "The UI tests passed on the iPad and the iPhone."
