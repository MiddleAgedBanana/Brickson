# Builds Brickson and runs its tests on GitHub's Mac machines, for every pull
# request and every change to main. Free for public repositories.
#
# Each job runs the same script you run on your Mac (scripts/test.sh): unit
# tests on the newest iPad Pro 13-inch simulator the chosen Xcode can run,
# UI tests on that iPad and then on the newest standard iPhone. Each job
# keeps its result bundles (build/TestResults: every test, screenshots of
# failures, the screens UI tests capture) as a download on the run's page
# for 14 days, whether the tests passed or failed.
#
# Both jobs build with Apple's newest released Xcode, never a pinned one
# (docs/DECISIONS.md, "Build with Apple's current Xcode"). `runs-on` names
# GitHub's machine image for the current major Xcode (xcode-27 holds
# Xcode 27); scripts/select-xcode.py picks the newest release installed on
# it, and warns on the run when Apple has released a newer Xcode than the
# machine has. When Apple releases the next major Xcode and GitHub
# publishes its image, move both `runs-on` lines to it.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, unfinished run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  unit:
    name: Unit tests
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Check the Xcode choice
        run: python3 scripts/test-select-xcode.py
      - name: Use the newest released Xcode
        run: |
          xcode="$(python3 scripts/select-xcode.py choose)"
          sudo xcode-select --switch "$xcode"
      - name: Compare with Apple's newest Xcode release
        run: python3 scripts/select-xcode.py check
      - name: Show the Xcode version and simulators
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes available
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew list --versions xcodegen
      - name: Check website contrast and links
        run: python3 scripts/test-site.py
      - name: Check the test script
        run: python3 scripts/test-runner.py
      - name: Build and run the unit tests
        run: scripts/test.sh unit
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/TestResults
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI tests
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest released Xcode
        run: |
          xcode="$(python3 scripts/select-xcode.py choose)"
          sudo xcode-select --switch "$xcode"
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew list --versions xcodegen
      - name: Build the app and run the UI tests
        run: scripts/test.sh ui
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: build/TestResults
          if-no-files-found: warn
          retention-days: 14
